services:
  notetaker:
    build: .
    image: notetaker:latest
    container_name: notetaker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Loopback only. The host Nginx is the single public entry point on
      # 80/443 and reverse-proxies to this address. Never bind 0.0.0.0 here.
      - "127.0.0.1:18100:5001"
    volumes:
      # SQLite lives on the host so the data survives image rebuilds.
      - ./data:/app/database
      # 代码也挂载进容器：服务器拉取依赖很慢，改代码后只需 restart，
      # 不必每次重新构建镜像（镜像里仍保留一份完整代码作为兜底）。
      - ./src:/app/src
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
