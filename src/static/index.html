<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="doc.title">NoteTaker - 个人笔记管理</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            /* Milk-yellow cream, fixed so it does not band on scroll.
               Kept warm all the way down instead of fading to pure white,
               so the white cards still read as cards at the bottom. */
            background: linear-gradient(168deg, #f6e7bd 0%, #faefd2 30%, #fcf4e0 66%, #fdf8ea 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #333;
        }

        .container {
            position: relative;  /* anchor for the language switch */
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            /* Was white, which is invisible on the cream background. */
            color: #3f361f;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            /* A dark drop shadow looks grubby on a light background; a faint
               white emboss keeps the title crisp instead. */
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            flex: 1;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            /* A neutral black shadow reads as grubby over cream; warm it. */
            box-shadow: 0 8px 28px rgba(120, 100, 50, 0.14);
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .note-editor {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 28px rgba(120, 100, 50, 0.14);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #177a52;
        }

        .new-note-btn {
            width: 100%;
            padding: 12px;
            /* Flat brand green. The old gradient ran down to #06281d, which
               read as almost black and was the heaviest thing on the page. */
            background: #0f7a54;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .new-note-btn:hover {
            transform: translateY(-2px);
            background: #0d6a49;
            box-shadow: 0 5px 15px rgba(15, 122, 84, 0.3);
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
            overflow-x: hidden;      /* no stray horizontal scrollbar */
            scrollbar-gutter: stable;
        }

        .note-item {
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            /* Deliberately no transform here: translating the item sideways
               overflowed .notes-list and produced a stray horizontal scrollbar
               while clipping the item's own right border. */
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            background: #f8f9fa;
        }

        .note-item:hover {
            background: #eef7f1;
            border-color: #1f9d6b;
            box-shadow: 0 4px 14px rgba(6, 40, 29, 0.16);
        }

        .note-item.active {
            border-color: #177a52;
            background: linear-gradient(135deg, rgba(23, 122, 82, 0.14) 0%, rgba(13, 74, 52, 0.10) 100%);
        }

        .note-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #333;
        }

        .note-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-date {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .editor-title {
            font-size: 1.5rem;
            color: #333;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: #28a745;
            color: white;
        }

        .btn-save:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #177a52;
        }

        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
            line-height: 1.6;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #177a52;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ffeeba;
            line-height: 1.6;
        }

        .warning code {
            background: rgba(0, 0, 0, 0.06);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 12px;
            word-break: break-all;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 15px;
            }
            
            .sidebar, .note-editor {
                padding: 20px;
            }
        }

        /* Custom Scrollbar */
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #177a52;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: #12603f;
        }

        /* Tag Cloud Styles */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
            min-height: 40px;
            align-items: flex-start;
            align-content: flex-start;
        }

        .tag-item {
            display: inline-block;
            padding: 4px 8px;
            background: #d8f0e2;
            color: #0d5a3d;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #b3ddc6;
            text-decoration: none;
            line-height: 1.2;
        }

        /* Frequency is expressed by the tint, not by `opacity`.
           Fading a light pill with opacity would wash it out into the amber
           panel behind it and drag the label's contrast down with it, so the
           text colour stays fixed and only the background varies.
           These rules must stay ABOVE :hover / .active: they have identical
           specificity, so source order decides the winner. */
        .tag-item.size-xs { font-size: 10px; background: #eaf7f0; }
        .tag-item.size-sm { font-size: 11px; background: #e2f4ea; }
        .tag-item.size-md { font-size: 12px; background: #d8f0e2; }
        .tag-item.size-lg { font-size: 13px; background: #cdeada; font-weight: 600; }
        .tag-item.size-xl { font-size: 14px; background: #c2e4d2; font-weight: 700; }

        .tag-item:hover {
            transform: translateY(-2px) scale(1.05);
            background: #b9e5cd;
            border-color: #8ccfae;
            box-shadow: 0 4px 12px rgba(23, 122, 82, 0.2);
        }

        /* Selected tag: solid brand green so it still stands out from the
           light pills around it. */
        .tag-item.active {
            background: #0f7a54;
            color: #fff;
            border-color: #0f7a54;
            box-shadow: 0 2px 8px rgba(15, 122, 84, 0.35);
            transform: scale(1.05);
        }

        .tag-stats {
            padding-top: 8px;
            border-top: 1px solid #e1e5e9;
            font-size: 11px;
            color: #666;
        }

        .tag-empty {
            text-align: center;
            padding: 20px 10px;
            color: #999;
            font-size: 12px;
            font-style: italic;
        }

        /* ---- role / auth bar ---- */
        .auth-bar {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .role-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            /* Guest state: a light pill. The signed-in state below is a
               solid green pill, so the two stay visually distinct. */
            background: rgba(255, 255, 255, 0.82);
            color: #0f7a54;
            border: 1px solid rgba(15, 122, 84, 0.28);
        }

        .role-badge.role-user {
            background: #0f7a54;
            color: #fff;
            border-color: #0f7a54;
        }

        .role-hint {
            font-size: 12px;
            color: #6b5d38;
        }

        .btn-auth {
            background: #fff;
            color: #0f7a54;
            font-weight: 600;
            padding: 6px 14px;
            font-size: 13px;
            border: 1px solid rgba(15, 122, 84, 0.25);
            box-shadow: 0 2px 6px rgba(120, 100, 50, 0.12);
        }

        /* ---- note visibility badge ---- */
        .note-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            vertical-align: middle;
        }

        .note-badge.public {
            background: #dcfce7;
            color: #15803d;
        }

        .note-badge.private {
            background: #f1f5f9;
            color: #64748b;
        }

        .note-badge.mine {
            background: #d1e7dd;
            color: #0d4a34;
        }

        /* ---- read-only banner ---- */
        .readonly-banner {
            margin: 10px 0;
            padding: 10px 12px;
            border-radius: 8px;
            background: #fff8dc;
            border-left: 4px solid #ffa500;
            font-size: 13px;
            color: #92400e;
        }

        /* ---- login modal ---- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .modal h3 {
            margin-bottom: 8px;
            color: #0f7a54;
            font-size: 18px;
        }

        .modal-desc {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .modal-error {
            color: #dc2626;
            font-size: 13px;
            min-height: 18px;
            margin: 8px 0 4px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-actions .btn {
            flex: 1;
        }

        .public-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #374151;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e1e5e9;
        }

        .public-toggle input {
            width: 16px;
            height: 16px;
        }

        .locked {
            opacity: 0.65;
        }

        /* ---- read-only guest notice ---- */
        .guest-notice {
            margin: 12px 0 4px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #e8f5ee;
            border-left: 4px solid #198754;
            color: #0d4a34;
            font-size: 13px;
            line-height: 1.6;
        }

        /* ---- site footer: legally required filing numbers ---- */
        .site-footer {
            margin-top: 28px;
            padding: 16px 0 6px;
            text-align: center;
            font-size: 12px;
            line-height: 2;
            color: #6b5d38;
        }

        .site-footer a {
            color: #6b5d38;
            text-decoration: none;
            border-bottom: 1px solid rgba(107, 93, 56, 0.5);
        }

        .site-footer a:hover {
            color: #5c4f2e;
            border-bottom-color: #5c4f2e;
        }

        .footer-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .police-icon {
            width: 16px;
            height: 16px;
            vertical-align: middle;
        }

        /* ---- language switch, pinned to the top-right corner ---- */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 50;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            color: #0f7a54;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(15, 122, 84, 0.22);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(120, 100, 50, 0.16);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .lang-switch:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(120, 100, 50, 0.22);
        }

        .lang-switch:active {
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .lang-switch {
                top: 12px;
                right: 12px;
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="lang-switch" id="langSwitch" type="button"
                data-i18n-title="lang.switchTitle" title="切换到英文">🌐 English</button>

        <div class="header">
            <h1>📝 NoteTaker</h1>
            <p data-i18n="header.tagline">记录想法，随手写下</p>
            <div class="auth-bar">
                <span class="role-badge" id="roleBadge">👤 游客模式</span>
                <span class="role-hint" id="roleHint"></span>
                <button class="btn btn-auth" id="authBtn" type="button">🔑 输入密码</button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <input type="text" class="search-box" id="searchBox"
                       data-i18n-placeholder="search.placeholder" placeholder="🔍 搜索笔记...">
                <button class="new-note-btn" id="newNoteBtn" data-i18n="btn.newNote">✨ 新建笔记</button>

                <!-- Shown when guest writing is disabled (GUEST_NOTE_LIMIT=0) -->
                <div id="guestNotice" class="guest-notice" style="display:none;"
                     data-i18n="guest.notice">📖 本站为只读展示，笔记内容由管理员维护。</div>
                
                <!-- Tag Cloud Section -->
                <div style="margin: 15px 0; padding: 10px; background: #fff8dc; border-radius: 8px; border-left: 4px solid #ffa500;">
                    <h4 style="margin: 0 0 10px 0; color: #ff8c00; font-size: 14px;"
                        data-i18n="tagCloud.title">🏷️ 标签云</h4>
                    <div id="tagCloud" class="tag-cloud">
                        <div class="loading" style="text-align: center; padding: 10px; font-size: 12px; color: #999;"
                             data-i18n="tagCloud.loading">标签加载中...</div>
                    </div>
                    <div id="tagStats" class="tag-stats" style="margin-top: 8px; font-size: 11px; color: #666; display: none;">
                        <span id="tagStatsText"></span>
                    </div>
                </div>

                <!-- Generate Notes Section (owner only; hidden from guests) -->
                <div id="aiPanel" style="margin: 15px 0; padding: 10px; background: #f2f9f5; border-radius: 8px; border-left: 4px solid #0f7a54;">
                    <h4 style="margin: 0 0 10px 0; color: #0f7a54; font-size: 14px;"
                        data-i18n="ai.title">🤖 智能生成笔记</h4>
                    <textarea id="naturalLanguageInput" data-i18n-placeholder="ai.placeholder"
                              placeholder="描述今天发生了什么、你的想法，或任何想变成笔记的内容..."
                              style="width: 100%; min-height: 80px; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
                    <button class="btn" id="generateNotesBtn" style="margin-top: 8px; width: 100%; font-size: 13px; padding: 8px;"
                            data-i18n="ai.button">🚀 生成笔记</button>
                </div>
                
                <div class="notes-list" id="notesList">
                    <div class="loading" data-i18n="notes.loading">笔记加载中...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <h2 class="editor-title" id="editorTitle">选择一条笔记开始编辑</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <button class="btn btn-save" id="saveBtn" data-i18n="btn.save">💾 保存</button>
                        <button class="btn btn-delete" id="deleteBtn" data-i18n="btn.delete">🗑️ 删除</button>
                    </div>
                </div>

                <div id="messageArea"></div>
                <div id="readonlyBanner" class="readonly-banner" style="display:none;"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle" data-i18n="form.title">标题</label>
                        <input type="text" class="form-input" id="noteTitle"
                               data-i18n-placeholder="form.titlePlaceholder" placeholder="输入笔记标题...">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="noteContent" data-i18n="form.content">内容</label>
                        <textarea class="form-textarea" id="noteContent"
                                  data-i18n-placeholder="form.contentPlaceholder" placeholder="开始写你的笔记..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="noteTags" data-i18n="form.tags">标签（用逗号分隔）</label>
                        <input type="text" class="form-input" id="noteTags"
                               data-i18n-placeholder="form.tagsPlaceholder" placeholder="例如：工作,灵感,生活">
                    </div>

                    <div class="form-group" style="display:flex; gap:10px;">
                        <div style="flex:1;">
                            <label class="form-label" for="noteEventDate" data-i18n="form.eventDate">事件日期</label>
                            <input type="date" class="form-input" id="noteEventDate">
                        </div>
                        <div style="width:160px;">
                            <label class="form-label" for="noteEventTime" data-i18n="form.eventTime">事件时间</label>
                            <input type="time" class="form-input" id="noteEventTime">
                        </div>
                    </div>

                    <div class="form-group" id="publicToggleGroup" style="display:none;">
                        <label class="public-toggle" for="notePublic">
                            <input type="checkbox" id="notePublic">
                            <span data-i18n="form.public">🌐 公开这条笔记（其他访客可见）</span>
                        </label>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3 data-i18n="empty.title">欢迎使用 NoteTaker！</h3>
                    <p data-i18n="empty.desc">从左侧选择一条笔记，或新建一条开始。</p>
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <div class="footer-line">
                <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">新ICP备2026009541号-1</a>
            </div>

            <!--
                公安联网备案号占位。办理完成后需要做三件事：
                  1. 去掉下面 id="policeRecord" 那行的 style="display:none;"
                  2. 把「新公网安备 XXXXXXXXXXXXXX 号」换成真实备案号
                  3. 把上方链接里 code= 后面补上公安备案查询编号，
                     并把官方提供的图标文件放到 src/static/police-record.png
            -->
            <div class="footer-line" id="policeRecord" style="display:none;">

        class NoteTaker {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.isLoading = false;
                this.tagStats = null;
                this.activeTag = null;  // 跟踪当前活动的标签
                this.role = 'guest';
                this.authenticated = false;
                this.guestNoteLimit = 1;
                this.init();
            }

            detectLang() {
                // ?lang=en (or zh) wins for this page load, so an English link
                // can simply be shared.
                try {
                    const fromUrl = new URLSearchParams(window.location.search).get('lang');
                    if (fromUrl === 'zh' || fromUrl === 'en') return fromUrl;
                } catch (e) {
                    // URLSearchParams should always exist; ignore if it does not.
                }
                try {
                    const saved = localStorage.getItem('notetaker.lang');
                    if (saved === 'zh' || saved === 'en') return saved;
                } catch (e) {
                    // localStorage can be unavailable (private mode); fall through.
                }
                return 'zh';  // the site's default language is Chinese
            }

            /** Look up a localised message, substituting {0}, {1}, ... */
            t(key, ...args) {
                const table = MSG[this.lang] || MSG.zh;
                let text = table[key];
                if (text === undefined) text = MSG.zh[key];
                if (text === undefined) return key;
                args.forEach((value, index) => {
                    text = text.split('{' + index + '}').join(String(value));
                });
                return text;
            }

            /** Turn a server error payload into a localised sentence. */
            errText(data, fallbackKey) {
                const code = data && data.error;
                if (code === 'guest_limit_reached') {
                    return this.t('err.guest_limit_reached', this.guestNoteLimit);
                }
                if (code && MSG.zh['err.' + code] !== undefined) {
                    return this.t('err.' + code);
                }
                return (data && data.message) || this.t(fallbackKey || 'err.generic');
            }

            /** Push the current language into every tagged static element. */
            applyLanguage() {
                // Snapshot the original Chinese the first time we run, so
                // switching back to Chinese is lossless.
                if (!this.zhSnapshot) {
                    this.zhSnapshot = { text: {}, placeholder: {}, title: {} };
                    document.querySelectorAll('[data-i18n]').forEach(el => {
                        this.zhSnapshot.text[el.getAttribute('data-i18n')] = el.innerHTML;
                    });
                    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                        this.zhSnapshot.placeholder[el.getAttribute('data-i18n-placeholder')] =
                            el.getAttribute('placeholder');
                    });
                    document.querySelectorAll('[data-i18n-title]').forEach(el => {
                        this.zhSnapshot.title[el.getAttribute('data-i18n-title')] =
                            el.getAttribute('title') || '';
                    });
                }

                const isEn = this.lang === 'en';
                document.documentElement.lang = isEn ? 'en' : 'zh-CN';

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    el.innerHTML = (isEn && I18N_EN[key] !== undefined)
                        ? I18N_EN[key] : this.zhSnapshot.text[key];
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    el.setAttribute('placeholder', (isEn && I18N_EN[key] !== undefined)
                        ? I18N_EN[key] : this.zhSnapshot.placeholder[key]);
                });
                document.querySelectorAll('[data-i18n-title]').forEach(el => {
                    const key = el.getAttribute('data-i18n-title');
                    el.setAttribute('title', (isEn && I18N_EN[key] !== undefined)
                        ? I18N_EN[key] : this.zhSnapshot.title[key]);
                });

                const btn = document.getElementById('langSwitch');
                if (btn) btn.textContent = this.t('lang.switchLabel');

                // Pieces that JS renders rather than data-i18n.
                this.updateAuthUI();
                if (this.notes && this.notes.length) this.renderNotesList();
                this.renderTagCloud();
                this.refreshEditorLanguage();
            }

            /** Re-render the editor header / read-only banner in the new language. */
            refreshEditorLanguage() {
                const titleEl = document.getElementById('editorTitle');
                if (this.currentNote && this.currentNote.id) {
                    titleEl.textContent = this.currentNote.title || this.t('msg.untitled');
                    this.setReadOnly(!this.currentNote.can_edit);
                } else if (this.currentNote) {
                    titleEl.textContent = this.t('msg.newNoteTitle');
                    this.setReadOnly(false);
                } else {
                    titleEl.textContent = this.t('editor.selectPrompt');
                }
                this.hideMessage();
            }

            toggleLang() {
                this.lang = this.lang === 'zh' ? 'en' : 'zh';
                try {
                    localStorage.setItem('notetaker.lang', this.lang);
                } catch (e) {
                    // ignore: language simply will not persist
                }
                this.applyLanguage();
            }

            async init() {
                this.lang = this.detectLang();
                this.zhSnapshot = null;
                this.applyLanguage();
                this.bindEvents();
                await this.loadAuthStatus();
                await this.loadNotes();
                await this.loadTagCloud();
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('searchBox').addEventListener('input', (e) => this.searchNotes(e.target.value));
                document.getElementById('generateNotesBtn').addEventListener('click', () => this.generateNotes());
                
                // Auto-save on content change (debounced)
                let saveTimeout;
                const autoSave = () => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        if (this.currentNote && this.currentNote.id) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };
                
                document.getElementById('noteTitle').addEventListener('input', autoSave);
                document.getElementById('noteContent').addEventListener('input', autoSave);

                // --- auth controls ---
                document.getElementById('authBtn').addEventListener('click', () => this.onAuthButtonClick());
                document.getElementById('langSwitch').addEventListener('click', () => this.toggleLang());
                document.getElementById('loginCancelBtn').addEventListener('click', () => this.closeLogin());
                document.getElementById('loginSubmitBtn').addEventListener('click', () => this.submitLogin());
                document.getElementById('loginPassword').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.submitLogin();
                    }
                });
                document.getElementById('loginModal').addEventListener('click', (e) => {
                    if (e.target.id === 'loginModal') this.closeLogin();
                });
            }

            // ================= auth / role =================

            async loadAuthStatus() {
                try {
                    const resp = await fetch('/api/auth/status');
                    if (!resp.ok) throw new Error('status failed');
                    const data = await resp.json();
                    this.role = data.role || 'guest';
                    this.authenticated = !!data.authenticated;
                    if (data.guest_note_limit !== undefined) {
                        this.guestNoteLimit = data.guest_note_limit;
                    }
                } catch (e) {
                    // Fail closed: treat as guest if we cannot confirm the session.
                    this.role = 'guest';
                    this.authenticated = false;
                }
                this.updateAuthUI();
            }

            updateAuthUI() {
                const badge = document.getElementById('roleBadge');
                const hint = document.getElementById('roleHint');
                const authBtn = document.getElementById('authBtn');

                // GUEST_NOTE_LIMIT=0 means the site is a read-only showcase
                // (used while it is filed as a non-interactive service).
                const readOnlySite = !this.authenticated && this.guestNoteLimit === 0;

                if (this.authenticated) {
                    badge.textContent = this.t('role.loggedIn');
                    badge.classList.add('role-user');
                    hint.textContent = '';
                    authBtn.textContent = this.t('auth.logout');
                } else if (readOnlySite) {
                    badge.textContent = this.t('role.readonly');
                    badge.classList.remove('role-user');
                    hint.textContent = this.t('role.hintReadonly');
                    authBtn.textContent = this.t('auth.adminLogin');
                } else {
                    badge.textContent = this.t('role.guest');
                    badge.classList.remove('role-user');
                    const used = this.myGuestNoteCount();
                    const left = Math.max(0, this.guestNoteLimit - used);
                    hint.textContent = left > 0
                        ? this.t('role.hintQuota', left)
                        : this.t('role.hintQuotaUsed');
                    authBtn.textContent = this.t('auth.login');
                }

                // The public toggle is owner-only.
                const group = document.getElementById('publicToggleGroup');
                if (group) group.style.display = this.authenticated ? 'block' : 'none';

                // Hide every writing affordance from guests, not just disable it:
                // a reviewer looking at a read-only site should not see input
                // forms for creating content.
                const newBtn = document.getElementById('newNoteBtn');
                if (newBtn) newBtn.style.display = (this.authenticated || !readOnlySite) ? '' : 'none';

                const guestNotice = document.getElementById('guestNotice');
                if (guestNotice) guestNotice.style.display = readOnlySite ? 'block' : 'none';

                // AI features are owner-only and hidden entirely from guests.
                const aiPanel = document.getElementById('aiPanel');
                if (aiPanel) aiPanel.style.display = this.authenticated ? 'block' : 'none';
            }

            myGuestNoteCount() {
                // Notes the current guest created are the ones they are allowed to edit.
                return this.notes.filter(n => !n.is_public && n.can_edit).length;
            }

            onAuthButtonClick() {
                if (this.authenticated) {
                    this.logout();
                } else {
                    this.openLogin();
                }
            }

            openLogin(message) {
                const modal = document.getElementById('loginModal');
                const err = document.getElementById('loginError');
                err.textContent = message || '';
                document.getElementById('loginPassword').value = '';
                modal.classList.add('open');
                setTimeout(() => document.getElementById('loginPassword').focus(), 50);
            }

            closeLogin() {
                document.getElementById('loginModal').classList.remove('open');
                document.getElementById('loginError').textContent = '';
            }

            async submitLogin() {
                const password = document.getElementById('loginPassword').value;
                const err = document.getElementById('loginError');
                const btn = document.getElementById('loginSubmitBtn');

                if (!password) {
                    err.textContent = this.t('login.enterPassword');
                    return;
                }

                btn.disabled = true;
                btn.textContent = this.t('login.submitting');
                err.textContent = '';

                try {
                    const resp = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    const data = await resp.json().catch(() => ({}));

                    if (!resp.ok) {
                        err.textContent = this.errText(data, 'err.invalid_password');
                        return;
                    }

                    this.authenticated = true;
                    this.role = 'user';
                    this.closeLogin();
                    this.updateAuthUI();
                    this.showMessage(this.t('login.success'), 'success');
                    await this.loadNotes();
                    await this.loadTagCloud();
                } catch (e) {
                    err.textContent = this.t('login.failed');
                } finally {
                    btn.disabled = false;
                    btn.textContent = this.t('login.submit');
                }
            }

            async logout() {
                try {
                    await fetch('/api/auth/logout', { method: 'POST' });
                } catch (e) {
                    // ignore, we still drop local state below
                }
                this.authenticated = false;
                this.role = 'guest';
                this.currentNote = null;
                this.hideEditor();
                this.updateAuthUI();
                this.showMessage(this.t('logout.success'), 'success');
                await this.loadNotes();
                await this.loadTagCloud();
            }

            /**
             * Turn an auth/permission failure into a clear prompt.
             * Returns true when the response was an auth problem already handled.
             */
            async handleAuthFailure(resp) {
                if (resp.status === 401) {
                    this.openLogin(this.t('err.auth_required'));
                    return true;
                }
                if (resp.status === 403) {
                    const data = await resp.json().catch(() => ({}));
                    if (data.error === 'guest_write_disabled') {
                        this.showMessage(this.errText(data), 'error');
                        this.openLogin(this.t('prompt.readonlyLogin'));
                        return true;
                    }
                    if (data.error === 'guest_limit_reached') {
                        this.showMessage(this.errText(data), 'error');
                        this.openLogin(this.t('prompt.quotaLogin'));
                        return true;
                    }
                    this.showMessage(this.errText(data, 'err.forbidden'), 'error');
                    return true;
                }
                return false;
            }

            async loadNotes() {
                this.isLoading = true;
                this.showMessage(this.t('msg.loadingNotes'), 'loading');
                
                try {
                    const response = await fetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.updateAuthUI();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(this.t('msg.loadNotesFailed', error.message), 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            /** Visibility / ownership badge shown next to a note title. */
            noteBadges(note) {
                let html = note.is_public
                    ? `<span class="note-badge public">${this.t('badge.public')}</span>`
                    : `<span class="note-badge private">${this.t('badge.private')}</span>`;
                if (!this.authenticated && note.can_edit) {
                    html += `<span class="note-badge mine">${this.t('badge.mine')}</span>`;
                }
                return html;
            }

            renderNotesList() {
                const notesList = document.getElementById('notesList');
                
                if (this.notes.length === 0) {
                    notesList.innerHTML = `<div class="empty-state"><p>${this.t('msg.noNotes')}</p></div>`;
                    return;
                }

                notesList.innerHTML = this.notes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || this.t('msg.untitledShort'))}${this.noteBadges(note)}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || this.t('msg.noContent'))}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)} ${note.event_date ? '· ' + note.event_date : ''} ${this.formatTime(note.event_time)}</div>
                    </div>
                `).join('');
            }

            async selectNote(noteId) {
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                // Clear any active tag filter when selecting a note
                if (this.activeTag) {
                    this.activeTag = null;
                    this.renderTagCloud();
                }

                this.currentNote = note;
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state
                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                document.getElementById('noteTags').value = (note.tags && note.tags.length) ? note.tags.join(',') : '';
                document.getElementById('noteEventDate').value = note.event_date || '';
                document.getElementById('noteEventTime').value = note.event_time || '';
                document.getElementById('notePublic').checked = !!note.is_public;
                document.getElementById('editorTitle').textContent = note.title || this.t('msg.untitled');
                this.setReadOnly(!note.can_edit);
            }

            /** Lock the editor for notes the current viewer may only read. */
            setReadOnly(readonly) {
                ['noteTitle', 'noteContent', 'noteTags', 'noteEventDate', 'noteEventTime'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.readOnly = readonly;
                });

                const banner = document.getElementById('readonlyBanner');
                banner.style.display = readonly ? 'block' : 'none';
                banner.textContent = readonly
                    ? this.t(this.guestNoteLimit === 0 ? 'msg.readonlyBannerRO' : 'msg.readonlyBanner')
                    : '';

                const saveBtn = document.getElementById('saveBtn');
                const deleteBtn = document.getElementById('deleteBtn');
                if (readonly) {
                    if (saveBtn) saveBtn.style.display = 'none';
                    if (deleteBtn) deleteBtn.style.display = 'none';
                } else {
                    if (saveBtn) saveBtn.style.display = 'inline-block';
                    if (deleteBtn) {
                        deleteBtn.style.display = (this.currentNote && this.currentNote.id) ? 'inline-block' : 'none';
                    }
                }

                const group = document.getElementById('publicToggleGroup');
                if (group) group.style.display = (this.authenticated && !readonly) ? 'block' : 'none';
            }

            createNewNote() {
                // The server enforces this too; this is only for a clear message.
                if (!this.authenticated) {
                    if (this.guestNoteLimit === 0) {
                        this.showMessage(this.t('err.guest_write_disabled'), 'error');
                        this.openLogin(this.t('prompt.readonlyLogin'));
                        return;
                    }
                    if (this.myGuestNoteCount() >= this.guestNoteLimit) {
                        this.showMessage(
                            this.t('err.guest_limit_reached', this.guestNoteLimit),
                            'error'
                        );
                        this.openLogin(this.t('prompt.quotaLogin'));
                        return;
                    }
                }

                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    tags: [],
                    event_date: null,
                    event_time: null,
                    is_public: false,
                    can_edit: true,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                this.showEditor();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('noteTags').value = '';
                document.getElementById('noteEventDate').value = '';
                document.getElementById('noteEventTime').value = '';
                document.getElementById('notePublic').checked = false;
                document.getElementById('editorTitle').textContent = this.t('msg.newNoteTitle');
                this.setReadOnly(false);
                document.getElementById('noteTitle').focus();
                
                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            showEditor() {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'block';
                document.getElementById('editorActions').style.display = 'flex';

                // 修复：新建笔记时隐藏删除按钮
                const deleteBtn = document.getElementById('deleteBtn');
                if (this.currentNote && this.currentNote.id) {
                    deleteBtn.style.display = 'inline-block';
                } else {
                    deleteBtn.style.display = 'none';
                }
            }

            hideEditor() {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                document.getElementById('editorTitle').textContent = this.t('editor.selectPrompt');

                const roBanner = document.getElementById('readonlyBanner');
                if (roBanner) roBanner.style.display = 'none';
                
                // Clear all form fields to avoid confusion
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('noteTags').value = '';
                document.getElementById('noteEventDate').value = '';
                document.getElementById('noteEventTime').value = '';
                document.getElementById('notePublic').checked = false;
                // Clear current note reference
                this.currentNote = null;
                
                this.currentNote = null;
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote) return;

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    if (!isAutoSave) {
                        this.showMessage(this.t('msg.enterTitleOrContent'), 'error');
                    }
                    return;
                }

                try {
                    const noteData = {
                        title: title || this.t('msg.untitledShort'),
                        content: content,
                        tags: document.getElementById('noteTags').value ? document.getElementById('noteTags').value.split(',').map(t => t.trim()).filter(Boolean) : [],
                        event_date: document.getElementById('noteEventDate').value || null,
                        event_time: document.getElementById('noteEventTime').value || null
                    };

                    // Only the owner may change visibility; the server ignores
                    // this field for guests.
                    if (this.authenticated) {
                        noteData.is_public = document.getElementById('notePublic').checked;
                    }

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) {
                        if (isAutoSave) return;
                        if (await this.handleAuthFailure(response)) return;
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error || 'Failed to save note');
                    }

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    this.renderNotesList();
                    document.getElementById('editorTitle').textContent = savedNote.title;
                    
                    // Refresh tag cloud after saving (tags might have changed)
                    await this.loadTagCloud();
                    
                    if (!isAutoSave) {
                        this.showMessage(this.t('msg.saveSuccess'), 'success');
                    }
                } catch (error) {
                    this.showMessage(this.t('msg.saveError', error.message), 'error');
                }
            }

            async generateNotes() {
                const naturalLanguageInput = document.getElementById('naturalLanguageInput').value.trim();
                const generateBtn = document.getElementById('generateNotesBtn');
                
                if (!naturalLanguageInput) {
                    this.showMessage(this.t('msg.enterGenInput'), 'error');
                    return;
                }

                // Disable button and show loading state
                generateBtn.disabled = true;
                generateBtn.textContent = this.t('msg.generatingButton');
                this.showMessage(this.t('msg.generating'), 'loading');

                try {
                    const response = await fetch('/api/generate-notes', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            user_input: naturalLanguageInput
                        })
                    });

                    if (!response.ok) {
                        if (await this.handleAuthFailure(response)) return;
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error || `Server error: ${response.status}`);
                    }

                    const data = await response.json();

                    // Create a new note with the generated content
                    this.createNewNote();

                    // Populate the form with generated data
                    document.getElementById('noteTitle').value = data.title || 'Generated Note';
                    document.getElementById('noteContent').value = data.content || '';
                    document.getElementById('noteTags').value = (data.tags && data.tags.length) ? data.tags.join(',') : '';

                    // Populate date field robustly: accept 'YYYY-MM-DD', 'YYYY-MM-DDT..', or other ISO-like strings
                    const rawDate = data.event_date || '';
                    let normalizedDate = '';
                    if (rawDate) {
                        // Try to extract YYYY-MM-DD using regex
                        const dateMatch = rawDate.match(/(\d{4}-\d{2}-\d{2})/);
                        if (dateMatch) {
                            normalizedDate = dateMatch[1];
                        } else {
                            // Fallback: try creating a Date and using toISOString (avoid timezone shift by using UTC parts)
                            try {
                                const dt = new Date(rawDate);
                                if (!isNaN(dt.getTime())) {
                                    // Build YYYY-MM-DD from local date components to match input[type=date] expectations
                                    const y = dt.getFullYear();
                                    const m = String(dt.getMonth() + 1).padStart(2, '0');
                                    const d = String(dt.getDate()).padStart(2, '0');
                                    normalizedDate = `${y}-${m}-${d}`;
                                }
                            } catch (e) {
                                normalizedDate = '';
                            }
                        }
                    }
                    document.getElementById('noteEventDate').value = normalizedDate || '';

                    // Populate time field robustly: accept 'HH:MM', 'HH:MM:SS', 'HH:MM:SSZ', or '17:00:00'
                    const rawTime = data.event_time || '';
                    let normalizedTime = '';
                    if (rawTime) {
                        // Try to find HH:MM using regex
                        const timeMatch = rawTime.match(/(\d{1,2}:\d{2})/);
                        if (timeMatch) {
                            // Ensure two-digit hour
                            const parts = timeMatch[1].split(':');
                            const hh = String(parseInt(parts[0], 10)).padStart(2, '0');
                            const mm = String(parseInt(parts[1], 10)).padStart(2, '0');
                            normalizedTime = `${hh}:${mm}`;
                        } else {
                            // Try to parse times like '5pm' or '5 PM'
                            const pmMatch = rawTime.match(/(\d{1,2})\s*(am|pm)/i);
                            if (pmMatch) {
                                let hour = parseInt(pmMatch[1], 10);
                                const ampm = pmMatch[2].toLowerCase();
                                if (ampm === 'pm' && hour < 12) hour += 12;
                                if (ampm === 'am' && hour === 12) hour = 0;
                                normalizedTime = `${String(hour).padStart(2, '0')}:00`;
                            }
                        }
                    }
                    document.getElementById('noteEventTime').value = normalizedTime || '';

                    // Clear the natural language input
                    document.getElementById('naturalLanguageInput').value = '';

                    if (data.ai_used === false) {
                        // The backend degraded to the local date/time parser.
                        // Show a warning but keep the generated draft, because
                        // it is still usable.
                        this.showMessage(
                            this.t('msg.genDegraded',
                                   this.escapeHtml(data.warning || this.t('msg.unknownReason'))),
                            'warning'
                        );
                    } else {
                        this.showMessage(this.t('msg.genSuccess'), 'success');
                    }
                    
                } catch (error) {
                    this.showMessage(this.t('msg.genError', error.message), 'error');
                } finally {
                    // Re-enable button
                    generateBtn.disabled = false;
                    generateBtn.textContent = this.t('msg.generateButton');
                }
            }

            async deleteNote() {
                if (!this.currentNote || !this.currentNote.id) return;

                if (!confirm(this.t('msg.confirmDelete'))) return;

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) {
                        if (await this.handleAuthFailure(response)) return;
                        throw new Error('Failed to delete note');
                    }

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    
                    // Refresh tag cloud after deletion
                    await this.loadTagCloud();
                    
                    this.showMessage(this.t('msg.deleteSuccess'), 'success');
                } catch (error) {
                    this.showMessage(this.t('msg.deleteError', error.message), 'error');
                }
            }

            async loadTagCloud() {
                try {
                    const response = await fetch('/api/tags/statistics');
                    if (!response.ok) throw new Error('Failed to load tag statistics');
                    
                    this.tagStats = await response.json();
                    this.renderTagCloud();
                } catch (error) {
                    console.error('Error loading tag cloud:', error);
                    this.renderEmptyTagCloud(this.t('msg.tagStatsFailed'));
                }
            }

            renderTagCloud() {
                const tagCloudDiv = document.getElementById('tagCloud');
                const tagStatsDiv = document.getElementById('tagStats');
                const tagStatsText = document.getElementById('tagStatsText');

                if (!this.tagStats || !this.tagStats.tag_counts || this.tagStats.tag_counts.length === 0) {
                    this.renderEmptyTagCloud(this.t('msg.tagNoTags'));
                    return;
                }

                // Render tag items
                const tagItems = this.tagStats.tag_counts.map(tagData => {
                    const sizeClass = this.getTagSizeClass(tagData.weight);
                    const isActive = this.activeTag === tagData.tag;
                    const activeClass = isActive ? 'active' : '';
                    return `<span class="tag-item ${sizeClass} ${activeClass}" 
                                  data-tag="${this.escapeHtml(tagData.tag)}" 
                                  data-count="${tagData.count}"
                                  onclick="noteTaker.filterByTag('${this.escapeHtml(tagData.tag)}')"
                                  title="${this.escapeHtml(tagData.tag)}: ${tagData.count} notes (${tagData.percentage}%)">
                                ${this.escapeHtml(tagData.tag)} (${tagData.count})
                            </span>`;
                }).join('');

                tagCloudDiv.innerHTML = tagItems;

                // Show statistics
                tagStatsDiv.style.display = 'block';
                tagStatsText.textContent = this.t('msg.tagUniqueCount', this.tagStats.unique_tags, this.tagStats.total_tags);
            }

            renderEmptyTagCloud(message) {
                const tagCloudDiv = document.getElementById('tagCloud');
                const tagStatsDiv = document.getElementById('tagStats');
                
                tagCloudDiv.innerHTML = `<div class="tag-empty">${message}</div>`;
                tagStatsDiv.style.display = 'none';
            }

            getTagSizeClass(weight) {
                if (weight >= 0.8) return 'size-xl';
                if (weight >= 0.6) return 'size-lg';
                if (weight >= 0.4) return 'size-md';
                if (weight >= 0.2) return 'size-sm';
                return 'size-xs';
            }

            async filterByTag(tagName) {
                try {
                    this.showMessage(this.t('msg.searchingTag', tagName), 'loading');
                    
                    let result;
                    let response;
                    
                    // 尝试 GET 方法 (原有方式)
                    try {
                        // 双重编码以处理 Vercel 环境的编码问题
                        const encodedTag = encodeURIComponent(tagName);
                        console.log(`[DEBUG] Trying GET with encoded tag: ${encodedTag}`);
                        
                        response = await fetch(`/api/tags/search/${encodedTag}`);
                        if (!response.ok) {
                            throw new Error(`GET request failed: ${response.status}`);
                        }
                        result = await response.json();
                        console.log(`[DEBUG] GET request successful:`, result);
                    } catch (getError) {
                        console.warn(`[WARN] GET method failed, trying POST:`, getError);
                        
                        // 如果 GET 失败，尝试 POST 方法
                        response = await fetch('/api/tags/search', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ tag: tagName })
                        });
                        
                        if (!response.ok) {
                            throw new Error(`Both GET and POST methods failed. POST status: ${response.status}`);
                        }
                        
                        result = await response.json();
                        console.log(`[DEBUG] POST request successful:`, result);
                    }
                    
                    if (result.notes.length === 0) {
                        this.showMessage(this.t('msg.tagNoneFor', tagName), 'error');
                        return;
                    }

                    // Set active tag and refresh tag cloud display
                    this.activeTag = tagName;
                    this.renderTagCloud();

                    // Clear current editor and hide it to avoid confusion
                    this.hideEditor();

                    // Update notes list with filtered results
                    const notesList = document.getElementById('notesList');
                    
                    // Add filter indicator header
                    let filterHeader = `
                        <div style="background: linear-gradient(135deg, #177a52 0%, #06281d 100%); 
                                   color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; 
                                   text-align: center; font-size: 13px; font-weight: 600;">
                            ${this.t('msg.filterHeader', this.escapeHtml(tagName), result.count)}
                            <button onclick="noteTaker.showAllNotes()" 
                                    style="background: rgba(255,255,255,0.2); border: none; color: white; 
                                           padding: 4px 8px; border-radius: 4px; margin-left: 10px; 
                                           font-size: 11px; cursor: pointer;">
                                ${this.t('msg.clearFilter')}
                            </button>
                        </div>
                    `;

                    notesList.innerHTML = filterHeader + result.notes.map(note => `
                        <div class="note-item" 
                             data-note-id="${note.id}" 
                             onclick="noteTaker.selectNote(${note.id})">
                            <div class="note-title">${this.escapeHtml(note.title || this.t('msg.untitledShort'))}${this.noteBadges(note)}</div>
                            <div class="note-preview">${this.escapeHtml(note.content || this.t('msg.noContent'))}</div>
                            <div class="note-date">${this.formatDate(note.updated_at)}</div>
                        </div>
                    `).join('');

                    // Update editor title to show filter status
                    document.getElementById('editorTitle').textContent = this.t('msg.filteredTitle', tagName);

                    this.showMessage(this.t('msg.filterHeader', tagName, result.count), 'success');
                } catch (error) {
                    this.showMessage(this.t('msg.tagFilterError', error.message), 'error');
                }
            }

            showAllNotes() {
                // Clear active tag and refresh tag cloud
                this.activeTag = null;
                this.renderTagCloud();
                
                // Clear any filters and show all notes
                this.renderNotesList();
                this.hideMessage();
                
                // Reset editor title
                document.getElementById('editorTitle').textContent = this.t('editor.selectPrompt');
                
                // If no note is currently selected, hide editor
                if (!this.currentNote) {
                    this.hideEditor();
                }
                
                // Clear search box if it has content
                document.getElementById('searchBox').value = '';
            }

            searchNotes(query) {
                const filteredNotes = query.trim() === '' ? this.notes : 
                    this.notes.filter(note => 
                        (note.title && note.title.toLowerCase().includes(query.toLowerCase())) ||
                        (note.content && note.content.toLowerCase().includes(query.toLowerCase()))
                    );

                const notesList = document.getElementById('notesList');
                if (filteredNotes.length === 0) {
                    notesList.innerHTML = `<div class="empty-state"><p>${this.t('msg.noSearchResult')}</p></div>`;
                    return;
                }

                notesList.innerHTML = filteredNotes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || this.t('msg.untitledShort'))}${this.noteBadges(note)}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || this.t('msg.noContent'))}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            showMessage(message, type) {
                const messageArea = document.getElementById('messageArea');
                messageArea.innerHTML = `<div class="${type}">${message}</div>`;
                
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            /** The API returns event_time as HH:MM:SS; show HH:MM. */
            formatTime(value) {
                if (!value) return '';
                const m = String(value).match(/^(\d{1,2}):(\d{2})/);
                return m ? `${m[1].padStart(2, '0')}:${m[2]}` : value;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return '';

                // Compare calendar days rather than elapsed hours: the old
                // Math.ceil(elapsedHours / 24) was off by one, so a note from
                // three days ago was labelled "2 days ago".
                const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
                const dayDiff = Math.round((startOfDay(new Date()) - startOfDay(date)) / 86400000);

                if (dayDiff <= 0) return this.t('date.today');
                if (dayDiff === 1) return this.t('date.yesterday');
                if (dayDiff <= 7) return this.t('date.daysAgo', dayDiff);
                return date.toLocaleDateString(this.lang === 'en' ? 'en-US' : 'zh-CN');
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
