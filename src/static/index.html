<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="doc.title">NoteTaker - 个人笔记管理</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            /* Milk-yellow cream, fixed so it does not band on scroll.
               Kept warm all the way down instead of fading to pure white,
               so the white cards still read as cards at the bottom. */
            background: linear-gradient(168deg, #f6e7bd 0%, #faefd2 30%, #fcf4e0 66%, #fdf8ea 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #333;
        }

        .container {
            position: relative;  /* anchor for the language switch */
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            /* Was white, which is invisible on the cream background. */
            color: #3f361f;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            /* A dark drop shadow looks grubby on a light background; a faint
               white emboss keeps the title crisp instead. */
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            /* 侧栏固定宽度：1fr/2fr 会被标签行的 min-content 撑变形 */
            grid-template-columns: 340px minmax(0, 1fr);
            gap: 26px;
            flex: 1;
            align-items: start;
        }

        .sidebar,
        .note-editor {
            min-width: 0;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            /* A neutral black shadow reads as grubby over cream; warm it. */
            box-shadow: 0 8px 28px rgba(120, 100, 50, 0.14);
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .note-editor {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 28px rgba(120, 100, 50, 0.14);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #177a52;
        }

        .new-note-btn {
            width: 100%;
            padding: 12px;
            /* Flat brand green. The old gradient ran down to #06281d, which
               read as almost black and was the heaviest thing on the page. */
            background: #0f7a54;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .new-note-btn:hover {
            transform: translateY(-2px);
            background: #0d6a49;
            box-shadow: 0 5px 15px rgba(15, 122, 84, 0.3);
        }

        .ai-result-panel {
            margin: 10px 0;
            padding: 12px 14px;
            border: 1px solid #e3e8ee;
            border-radius: 10px;
            background: #fbfdfb;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 700;
            color: #0f7a54;
        }

        .panel-toggle {
            padding: 2px 8px;
            font-size: 11px;
            font-family: inherit;
            color: #6b7280;
            background: #fff;
            border: 1px solid #e3e8ee;
            border-radius: 999px;
            cursor: pointer;
        }

        .panel-toggle:hover {
            color: #0f7a54;
            border-color: rgba(15, 122, 84, 0.35);
        }

        .ai-result-panel.collapsed .panel-body,
        .ai-result-panel.collapsed .todo-list {
            display: none;
        }

        .panel-body {
            font-size: 14px;
            line-height: 1.7;
            color: #374151;
            white-space: pre-wrap;
        }

        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .todo-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 14px;
            line-height: 1.5;
            cursor: pointer;
        }

        .todo-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-top: 3px;
            accent-color: #0f7a54;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .todo-item.done span {
            color: #9aa0a6;
            text-decoration: line-through;
        }

        /* ---- new note split button + menu ---- */
        .new-note-row {
            position: relative;
            display: flex;
            gap: 6px;
            margin: 12px 0;
        }

        .new-note-row .new-note-btn {
            flex: 1;
            margin: 0;
        }

        .new-note-caret {
            width: 40px;
            border: 1px solid rgba(15, 122, 84, 0.35);
            border-radius: 10px;
            background: #eaf6f0;
            color: #0f7a54;
            font-size: 13px;
            cursor: pointer;
        }

        .new-note-caret:hover {
            background: #dcefe5;
        }

        .new-note-menu {
            position: absolute;
            top: 46px;
            right: 0;
            z-index: 60;
            min-width: 150px;
            padding: 6px;
            border: 1px solid #e3e8ee;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 10px 24px rgba(120, 100, 50, 0.18);
        }

        .new-note-menu button {
            display: block;
            width: 100%;
            padding: 8px 10px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            text-align: left;
            color: #374151;
            cursor: pointer;
        }

        .new-note-menu button:hover {
            background: #f2f9f5;
            color: #0f7a54;
        }

        /* ---- editor back button (mobile only) ---- */
        .editor-back {
            display: none;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            margin-right: 10px;
            border: 1px solid #e3e8ee;
            border-radius: 10px;
            background: #fff;
            font-size: 16px;
            color: #0f7a54;
            cursor: pointer;
        }

        .view-toggle {
            display: flex;
            gap: 6px;
            margin: 8px 0 2px;
        }

        .view-btn {
            flex: 1;
            padding: 5px 0;
            font-size: 11px;
            font-family: inherit;
            color: #6b7280;
            background: #fff;
            border: 1px solid #e3e8ee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .view-btn.active {
            color: #0f7a54;
            border-color: rgba(15, 122, 84, 0.35);
            background: #eaf6f0;
            font-weight: 600;
        }

        .pin-btn {
            margin-left: 6px;
            padding: 0;
            border: 0;
            background: transparent;
            font-size: 12px;
            opacity: 0.35;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .pin-btn:hover,
        .pin-btn.on {
            opacity: 1;
        }

        .timeline-group-title {
            margin: 12px 0 6px;
            font-size: 12px;
            font-weight: 700;
            color: #0f7a54;
            letter-spacing: 0.3px;
        }

        .btn-share {
            background: #eaf6f0;
            color: #0f7a54;
            border: 1px solid rgba(15, 122, 84, 0.3);
        }

        .btn-share:hover {
            background: #dcefe5;
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
            overflow-x: hidden;      /* no stray horizontal scrollbar */
            scrollbar-gutter: stable;
        }

        .note-item {
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            /* Deliberately no transform here: translating the item sideways
               overflowed .notes-list and produced a stray horizontal scrollbar
               while clipping the item's own right border. */
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            background: #f8f9fa;
        }

        .note-item:hover {
            background: #eef7f1;
            border-color: #1f9d6b;
            box-shadow: 0 4px 14px rgba(6, 40, 29, 0.16);
        }

        .note-item.active {
            border-color: #177a52;
            background: linear-gradient(135deg, rgba(23, 122, 82, 0.14) 0%, rgba(13, 74, 52, 0.10) 100%);
        }

        .note-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #333;
        }

        .note-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-date {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .editor-title {
            font-size: 1.5rem;
            color: #333;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: #28a745;
            color: white;
        }

        .btn-save:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }

        .editor-toolbar .form-label {
            margin-bottom: 0;
        }

        .ai-tools {
            display: flex;
            gap: 6px;
        }

        .ai-tool-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            font-size: 12px;
            font-family: inherit;
            color: #0f7a54;
            background: #f2f9f5;
            border: 1px solid rgba(15, 122, 84, 0.25);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .ai-tool-btn:hover:not(:disabled) {
            background: #e3f4ec;
            transform: translateY(-1px);
        }

        .ai-tool-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #177a52;
        }

        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
            line-height: 1.6;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #177a52;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ffeeba;
            line-height: 1.6;
        }

        .warning code {
            background: rgba(0, 0, 0, 0.06);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 12px;
            word-break: break-all;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 15px;
            }
            
            .sidebar, .note-editor {
                padding: 20px;
            }
        }

        /* ---- mobile / tablet: single column, editor takes over ---- */
        @media (max-width: 900px) {
            .main-content {
                display: block;
            }

            .note-editor {
                display: none;
            }

            body.editing .sidebar {
                display: none;
            }

            body.editing .note-editor {
                display: flex;
                min-height: calc(100dvh - 210px);
            }

            .editor-back {
                display: inline-flex;
            }

            .header-actions {
                position: static;
                justify-content: center;
                margin-bottom: 14px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .header {
                margin-bottom: 18px;
            }

            .container {
                padding: 14px;
            }

            .sidebar,
            .note-editor {
                padding: 18px;
                border-radius: 14px;
            }

            .view-toggle {
                margin: 8px 0 0;
            }

            .view-btn {
                padding: 7px 0;
                font-size: 12px;
            }
        }

        /* Custom Scrollbar */
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #177a52;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: #12603f;
        }

        /* Tag Cloud Styles */
        .tag-section {
            margin: 12px 0;
            padding: 10px 12px;
            background: #fbfdfb;
            border: 1px solid #e6ebe8;
            border-radius: 10px;
        }

        .tag-section h4 {
            margin: 0 0 8px;
            color: #0f7a54;
            font-size: 13px;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: nowrap;
            gap: 6px;
            margin: 8px 0;
            min-height: 34px;
            align-items: center;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
        }

        .tag-cloud > * {
            flex: 0 0 auto;
        }

        .tag-cloud::-webkit-scrollbar {
            height: 4px;
        }

        .tag-cloud::-webkit-scrollbar-thumb {
            background: rgba(15, 122, 84, 0.25);
            border-radius: 999px;
        }

        /* 右侧渐隐，提示这一行可以横向滚动 */
        .tag-cloud {
            -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 26px), transparent 100%);
            mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 26px), transparent 100%);
        }

        .tag-item {
            display: inline-block;
            padding: 4px 8px;
            background: #d8f0e2;
            color: #0d5a3d;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #b3ddc6;
            text-decoration: none;
            line-height: 1.2;
        }

        /* Frequency is expressed by the tint, not by `opacity`.
           Fading a light pill with opacity would wash it out into the amber
           panel behind it and drag the label's contrast down with it, so the
           text colour stays fixed and only the background varies.
           These rules must stay ABOVE :hover / .active: they have identical
           specificity, so source order decides the winner. */
        .tag-item.size-xs { font-size: 10px; background: #eaf7f0; }
        .tag-item.size-sm { font-size: 11px; background: #e2f4ea; }
        .tag-item.size-md { font-size: 12px; background: #d8f0e2; }
        .tag-item.size-lg { font-size: 13px; background: #cdeada; font-weight: 600; }
        .tag-item.size-xl { font-size: 14px; background: #c2e4d2; font-weight: 700; }

        .tag-item:hover {
            transform: translateY(-2px) scale(1.05);
            background: #b9e5cd;
            border-color: #8ccfae;
            box-shadow: 0 4px 12px rgba(23, 122, 82, 0.2);
        }

        /* Selected tag: solid brand green so it still stands out from the
           light pills around it. */
        .tag-item.active {
            background: #0f7a54;
            color: #fff;
            border-color: #0f7a54;
            box-shadow: 0 2px 8px rgba(15, 122, 84, 0.35);
            transform: scale(1.05);
        }

        .tag-stats {
            padding-top: 8px;
            border-top: 1px solid #e1e5e9;
            font-size: 11px;
            color: #666;
        }

        .tag-empty {
            text-align: center;
            padding: 20px 10px;
            color: #999;
            font-size: 12px;
            font-style: italic;
        }

        /* ---- role / auth bar ---- */
        .auth-bar {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .role-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            /* Guest state: a light pill. The signed-in state below is a
               solid green pill, so the two stay visually distinct. */
            background: rgba(255, 255, 255, 0.82);
            color: #0f7a54;
            border: 1px solid rgba(15, 122, 84, 0.28);
        }

        .role-badge.role-user {
            background: #0f7a54;
            color: #fff;
            border-color: #0f7a54;
        }

        .ai-quota-hint {
            margin-left: 8px;
            font-size: 12px;
            font-weight: 400;
            color: #0f7a54;
            opacity: 0.8;
        }

        .role-hint {
            font-size: 12px;
            color: #6b5d38;
        }

        .btn-auth {
            background: #fff;
            color: #0f7a54;
            font-weight: 600;
            padding: 6px 14px;
            font-size: 13px;
            border: 1px solid rgba(15, 122, 84, 0.25);
            box-shadow: 0 2px 6px rgba(120, 100, 50, 0.12);
        }

        /* ---- note visibility badge ---- */
        .note-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            vertical-align: middle;
        }

        .note-badge.public {
            background: #dcfce7;
            color: #15803d;
        }

        .note-badge.private {
            background: #f1f5f9;
            color: #64748b;
        }

        .note-badge.mine {
            background: #d1e7dd;
            color: #0d4a34;
        }

        /* ---- read-only banner ---- */
        .readonly-banner {
            margin: 10px 0;
            padding: 10px 12px;
            border-radius: 8px;
            background: #fff8dc;
            border-left: 4px solid #ffa500;
            font-size: 13px;
            color: #92400e;
        }

        /* ---- login modal ---- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .modal h3 {
            margin-bottom: 8px;
            color: #0f7a54;
            font-size: 18px;
        }

        .modal-desc {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .modal-error {
            color: #dc2626;
            font-size: 13px;
            min-height: 18px;
            margin: 8px 0 4px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-actions .btn {
            flex: 1;
        }

        .public-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #374151;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e1e5e9;
        }

        .public-toggle input {
            width: 16px;
            height: 16px;
        }

        .locked {
            opacity: 0.65;
        }

        /* ---- read-only guest notice ---- */
        .guest-notice {
            margin: 12px 0 4px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #e8f5ee;
            border-left: 4px solid #198754;
            color: #0d4a34;
            font-size: 13px;
            line-height: 1.6;
        }

        /* ---- site footer: legally required filing numbers ---- */
        .site-footer {
            margin-top: 28px;
            padding: 16px 0 6px;
            text-align: center;
            font-size: 12px;
            line-height: 2;
            color: #6b5d38;
        }

        .site-footer a {
            color: #6b5d38;
            text-decoration: none;
            border-bottom: 1px solid rgba(107, 93, 56, 0.5);
        }

        .site-footer a:hover {
            color: #5c4f2e;
            border-bottom-color: #5c4f2e;
        }

        .footer-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .police-icon {
            width: 16px;
            height: 16px;
            vertical-align: middle;
        }

        /* ---- top-right actions (portfolio link + language switch) ---- */
        .header-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            color: #0f7a54;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(15, 122, 84, 0.22);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(120, 100, 50, 0.16);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .lang-switch:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(120, 100, 50, 0.22);
        }

        .lang-switch:active {
            transform: translateY(0);
        }

        /* keep the two pills visually identical: no underline, same font */
        .home-link {
            text-decoration: none;
        }

        @media (max-width: 640px) {
            .header-actions {
                top: 12px;
                right: 12px;
                gap: 6px;
            }

            .lang-switch {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        /* ---- mobile: final overrides (must stay last to win over base rules) ---- */
        @media (max-width: 900px) {
            .header-actions {
                position: static;
                justify-content: center;
                margin: 0 0 14px;
            }

            .header h1 {
                font-size: 1.65rem;
                margin-bottom: 4px;
            }

            /* 手机上省掉副标题，给列表腾出空间 */
            .header p {
                display: none;
            }

            .auth-bar {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .editor-header {
                flex-wrap: wrap;
                gap: 10px;
                margin-bottom: 14px;
            }

            .editor-title {
                flex: 1 1 auto;
                min-width: 0;
                font-size: 1.15rem;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .editor-actions {
                flex: 1 1 100%;
                justify-content: flex-end;
                gap: 8px;
            }

            .tag-stats {
                display: none !important;
            }

            /* 编辑时隐藏大标题区，给正文腾出空间 */
            body.editing .header {
                display: none;
            }

            body.editing .container {
                padding-top: 14px;
            }

            .editor-actions .btn {
                flex: 1;
                min-width: 0;
                padding: 0 10px;
                white-space: nowrap;
            }
        }

        /* ==================================================================
           P2 · design tokens + component polish
           Everything below is deliberate: one brand colour, one radius scale,
           one shadow level for cards and one for floating layers.
           ================================================================== */
        :root {
            --brand: #0f7a54;
            --brand-dark: #0b5e41;
            --brand-soft: #eaf6f0;
            --text: #1f2a24;
            --text-2: #5b6b62;
            --text-3: #8a9790;
            --line: #e6ebe8;
            --surface: #ffffff;
            --surface-muted: #fbfdfb;
            --danger: #d64545;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-card: 0 6px 24px rgba(31, 42, 36, 0.07);
            --shadow-pop: 0 12px 30px rgba(31, 42, 36, 0.14);
        }

        body {
            color: var(--text);
        }

        /* ---- surfaces ---- */
        .sidebar,
        .note-editor {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
        }

        .tag-section,
        .ai-result-panel,
        .guest-notice,
        #aiPanel {
            background: var(--surface-muted) !important;
            border: 1px solid var(--line) !important;
            border-left: 1px solid var(--line) !important;
            border-radius: var(--radius-md) !important;
            box-shadow: none !important;
        }

        .ai-result-panel .panel-title,
        .tag-section h4,
        #aiPanel h4 {
            color: var(--brand) !important;
        }

        /* ---- buttons ---- */
        .btn {
            min-height: 36px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-size: 13.5px;
            font-weight: 600;
        }

        .btn-save {
            background: var(--brand);
        }

        .btn-save:hover {
            background: var(--brand-dark);
        }

        .btn-delete {
            background: var(--danger);
        }

        .btn-delete:hover {
            background: #b93a3a;
        }

        .btn-share {
            background: var(--brand-soft);
            color: var(--brand);
            border-color: rgba(15, 122, 84, 0.25);
        }

        .new-note-btn {
            border-radius: 10px;
            min-height: 42px;
            font-weight: 600;
        }

        .new-note-caret {
            border-radius: 10px;
        }

        /* ---- form controls ---- */
        .form-input,
        .form-textarea,
        .search-box,
        #naturalLanguageInput {
            border-radius: 10px;
            border: 1px solid var(--line);
            font-size: 14px;
            color: var(--text);
            background: var(--surface);
        }

        .form-input:focus,
        .form-textarea:focus,
        .search-box:focus,
        #naturalLanguageInput:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(15, 122, 84, 0.12);
        }

        .form-label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-2);
            letter-spacing: 0.2px;
        }

        /* ---- typography ---- */
        .editor-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .note-title {
            font-size: 14.5px;
            font-weight: 600;
        }

        .note-preview {
            font-size: 13px;
            line-height: 1.55;
            color: var(--text-2);
        }

        .note-date {
            font-size: 11.5px;
            color: var(--text-3);
        }

        /* ---- list items ---- */
        .note-item {
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            transition: background 0.16s ease, border-color 0.16s ease;
        }

        .note-item:hover {
            background: var(--surface-muted);
        }

        .note-item.active {
            background: var(--brand-soft);
            border-color: rgba(15, 122, 84, 0.35);
            box-shadow: none;
        }

        /* ---- pills ---- */
        .tag-item,
        .ai-tool-btn,
        .view-btn,
        .panel-toggle,
        .note-badge {
            border-radius: 999px;
        }

        .view-btn.active {
            background: var(--brand-soft);
            border-color: rgba(15, 122, 84, 0.35);
            color: var(--brand);
        }

        /* ---- selection transition ---- */
        @keyframes editorIn {
            from {
                opacity: 0.35;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .note-editor.is-entering {
            animation: editorIn 0.22s ease;
        }

        .note-item {
            transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
        }

        .note-item:active {
            transform: scale(0.995);
        }

        /* ---- floating layers ---- */
        .new-note-menu,
        .modal {
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-pop);
            border: 1px solid var(--line);
        }

        .modal-overlay {
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <a class="lang-switch home-link" href="https://dabuw.online" target="_blank" rel="noopener"
               data-i18n="header.home" data-i18n-title="header.homeTitle"
               title="返回作者主页">🏠 作者主页</a>
            <button class="lang-switch" id="langSwitch" type="button"
                    data-i18n-title="lang.switchTitle" title="切换到英文">🌐 English</button>
        </div>

        <div class="header">
            <h1>📝 NoteTaker</h1>
            <p data-i18n="header.tagline">记录想法，随手写下</p>
            <div class="auth-bar">
                <span class="role-badge" id="roleBadge">👤 游客模式</span>
                <span class="role-hint" id="roleHint"></span>
                <button class="btn btn-auth" id="authBtn" type="button">🔑 输入密码</button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <input type="text" class="search-box" id="searchBox"
                       data-i18n-placeholder="search.placeholder" placeholder="🔍 搜索笔记...">
                <div class="new-note-row">
                    <button class="new-note-btn" id="newNoteBtn" data-i18n="btn.newNote">✨ 新建笔记</button>
                    <button class="new-note-caret" id="newNoteCaret" type="button"
                            data-i18n-title="newNote.more" title="更多新建方式">▾</button>
                    <div class="new-note-menu" id="newNoteMenu" style="display:none;">
                        <button type="button" data-new-mode="manual" data-i18n="newNote.manual">✍️ 手动写</button>
                        <button type="button" data-new-mode="ai" data-i18n="newNote.ai">🤖 AI 生成</button>
                    </div>
                </div>

                <div class="view-toggle" id="viewToggle">
                    <button class="view-btn active" type="button" data-view="list"
                            data-i18n="view.list">📋 列表</button>
                    <button class="view-btn" type="button" data-view="timeline"
                            data-i18n="view.timeline">📅 时间轴</button>
                </div>

                <!-- Shown when guest writing is disabled (GUEST_NOTE_LIMIT=0) -->
                <div id="guestNotice" class="guest-notice" style="display:none;"
                     data-i18n="guest.notice">📖 本站为只读展示，笔记内容由管理员维护。</div>
                
                <!-- Tag Cloud Section -->
                <div class="tag-section">
                    <h4 data-i18n="tagCloud.title">🏷️ 标签云</h4>
                    <div id="tagCloud" class="tag-cloud">
                        <div class="loading" style="text-align: center; padding: 10px; font-size: 12px; color: #999;"
                             data-i18n="tagCloud.loading">标签加载中...</div>
                    </div>
                    <div id="tagStats" class="tag-stats" style="margin-top: 8px; font-size: 11px; color: #666; display: none;">
                        <span id="tagStatsText"></span>
                    </div>
                </div>

                <!-- Generate Notes Section (owner only; hidden from guests) -->
                <div id="aiPanel" style="display:none; margin: 15px 0; padding: 10px; background: #f2f9f5; border-radius: 8px; border-left: 4px solid #0f7a54;">
                    <h4 style="margin: 0 0 10px 0; color: #0f7a54; font-size: 14px;">
                        <span data-i18n="ai.title">🤖 智能生成笔记</span>
                        <span id="aiQuotaHint" class="ai-quota-hint"></span>
                    </h4>
                    <textarea id="naturalLanguageInput" data-i18n-placeholder="ai.placeholder"
                              placeholder="描述今天发生了什么、你的想法，或任何想变成笔记的内容..."
                              style="width: 100%; min-height: 80px; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
                    <button class="btn" id="generateNotesBtn" style="margin-top: 8px; width: 100%; font-size: 13px; padding: 8px;"
                            data-i18n="ai.button">🚀 生成笔记</button>
                </div>
                
                <div class="notes-list" id="notesList">
                    <div class="loading" data-i18n="notes.loading">笔记加载中...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <button class="editor-back" id="editorBackBtn" type="button"
                            data-i18n-title="editor.back" title="返回列表">←</button>
                    <h2 class="editor-title" id="editorTitle">选择一条笔记开始编辑</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <button class="btn btn-share" id="shareBtn" data-i18n="btn.share">🔗 分享</button>
                        <button class="btn btn-save" id="saveBtn" data-i18n="btn.save">💾 保存</button>
                        <button class="btn btn-delete" id="deleteBtn" data-i18n="btn.delete">🗑️ 删除</button>
                    </div>
                </div>

                <div id="messageArea"></div>
                <div id="readonlyBanner" class="readonly-banner" style="display:none;"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle" data-i18n="form.title">标题</label>
                        <input type="text" class="form-input" id="noteTitle"
                               data-i18n-placeholder="form.titlePlaceholder" placeholder="输入笔记标题...">
                    </div>

                    <div id="summaryPanel" class="ai-result-panel" style="display:none;">
                        <div class="panel-head">
                            <span class="panel-title" data-i18n="summary.title">📝 AI 摘要</span>
                            <button class="panel-toggle" type="button" id="summaryToggle"
                                    data-i18n="panel.hide">隐藏</button>
                        </div>
                        <div id="summaryBody" class="panel-body"></div>
                    </div>

                    <div class="form-group">
                        <div class="editor-toolbar">
                            <label class="form-label" for="noteContent" data-i18n="form.content">内容</label>
                            <div class="ai-tools" id="aiTools">
                                <button class="ai-tool-btn" type="button" data-ai-mode="polish"
                                        data-i18n="ai.polish" title="把内容整理成通顺的书面表达">✨ 润色</button>
                                <button class="ai-tool-btn" type="button" data-ai-mode="summarize"
                                        data-i18n="ai.summarize" title="生成 2-3 句摘要，插入到正文开头">📝 摘要</button>
                                <button class="ai-tool-btn" type="button" data-ai-mode="todos"
                                        data-i18n="ai.todos" title="从正文提取待办清单，追加到末尾">✅ 待办</button>
                            </div>
                        </div>
                        <textarea class="form-textarea" id="noteContent"
                                  data-i18n-placeholder="form.contentPlaceholder" placeholder="开始写你的笔记..."></textarea>
                        <div id="todoPanel" class="ai-result-panel" style="display:none;">
                            <div class="panel-head">
                                <span class="panel-title" data-i18n="todo.title">✅ 待办清单</span>
                                <button class="panel-toggle" type="button" id="todoToggle"
                                        data-i18n="panel.hide">隐藏</button>
                            </div>
                            <div id="todoList" class="todo-list"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="noteTags" data-i18n="form.tags">标签（用逗号分隔）</label>
                        <input type="text" class="form-input" id="noteTags"
                               data-i18n-placeholder="form.tagsPlaceholder" placeholder="例如：工作,灵感,生活">
                    </div>

                    <div class="form-group" style="display:flex; gap:10px;">
                        <div style="flex:1;">
                            <label class="form-label" for="noteEventDate" data-i18n="form.eventDate">事件日期</label>
                            <input type="date" class="form-input" id="noteEventDate">
                        </div>
                        <div style="width:160px;">
                            <label class="form-label" for="noteEventTime" data-i18n="form.eventTime">事件时间</label>
                            <input type="time" class="form-input" id="noteEventTime">
                        </div>
                    </div>

                    <div class="form-group" id="publicToggleGroup" style="display:none;">
                        <label class="public-toggle" for="notePublic">
                            <input type="checkbox" id="notePublic">
                            <span data-i18n="form.public">🌐 公开这条笔记（其他访客可见）</span>
                        </label>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3 data-i18n="empty.title">欢迎使用 NoteTaker！</h3>
                    <p data-i18n="empty.desc">从左侧选择一条笔记，或新建一条开始。</p>
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <div class="footer-line">
                <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">新ICP备2026009541号-1</a>
            </div>

            <!--
                公安联网备案号占位。办理完成后需要做三件事：
                  1. 去掉下面 id="policeRecord" 那行的 style="display:none;"
                  2. 把「新公网安备 XXXXXXXXXXXXXX 号」换成真实备案号
                  3. 把上方链接里 code= 后面补上公安备案查询编号，
                     并把官方提供的图标文件放到 src/static/police-record.png
            -->
            <div class="footer-line" id="policeRecord" style="display:none;">
                <img src="/police-record.png" alt="公安联网备案" class="police-icon">
                <a href="https://beian.mps.gov.cn/#/query/webSearch?code=" target="_blank" rel="noopener noreferrer">
                    新公网安备 XXXXXXXXXXXXXX 号
                </a>
            </div>
        </footer>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <h3 data-i18n="login.title">🔑 输入密码</h3>
            <p class="modal-desc" data-i18n="login.desc">
                登录后可查看全部笔记、无限创建与修改，并使用 AI 生成功能。
            </p>
            <input type="password" class="form-input" id="loginPassword"
                   data-i18n-placeholder="login.placeholder" placeholder="请输入密码"
                   autocomplete="current-password">
            <div class="modal-error" id="loginError"></div>
            <div class="modal-actions">
                <button class="btn" id="loginCancelBtn" type="button" data-i18n="login.cancel">取消</button>
                <button class="btn btn-save" id="loginSubmitBtn" type="button" data-i18n="login.submit">登录</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="shareModal" style="display:none;">
        <div class="modal">
            <h3 data-i18n="share.title">🔗 分享这条笔记</h3>
            <p class="modal-desc" data-i18n="share.desc">拿到链接的人可以只读查看这条笔记，不需要密码。</p>
            <input type="text" class="form-input" id="shareUrl" readonly>
            <div class="modal-error" id="shareError"></div>
            <div class="modal-actions">
                <button class="btn" type="button" id="shareCopyBtn" data-i18n="share.copy">复制链接</button>
                <button class="btn btn-delete" type="button" id="shareRevokeBtn" data-i18n="share.revoke">取消分享</button>
                <button class="btn" type="button" id="shareCloseBtn" data-i18n="share.close">关闭</button>
            </div>
        </div>
    </div>

    <script>

        // ==================================================================
        // Internationalisation
        // ------------------------------------------------------------------
        // Chinese is the source language: it lives inline in the HTML and in
        // MSG.zh. Only the English strings are listed as overrides, and
        // applyLanguage() snapshots the original Chinese the first time it
        // runs, so switching back and forth is lossless.
        // ==================================================================
        const I18N_EN = {
            'doc.title': 'NoteTaker - Personal Note Manager',
            'header.tagline': 'Capture your thoughts as they come',
            'header.home': '🏠 Portfolio',
            'header.homeTitle': 'Back to my portfolio',
            'lang.switchTitle': '切换到中文',
            'search.placeholder': '🔍 Search notes...',
            'btn.newNote': '✨ New Note',
            'guest.notice': '📖 Read-only showcase. Notes are maintained by the administrator.',
            'tagCloud.title': '🏷️ Tag Cloud',
            'tagCloud.loading': 'Loading tags...',
            'ai.title': '🤖 Generate Notes',
            'ai.placeholder': 'Describe what happened today, your thoughts, or anything you want turned into a note...',
            'ai.button': '🚀 Generate Notes',
            'newNote.more': 'More ways to create a note',
            'newNote.manual': '✍️ Write manually',
            'newNote.ai': '🤖 Generate with AI',
            'editor.back': 'Back to list',
            'view.list': '📋 List',
            'view.timeline': '📅 Timeline',
            'btn.share': '🔗 Share',
            'share.title': '🔗 Share this note',
            'share.desc': 'Anyone with the link can read this note. No password needed.',
            'share.copy': 'Copy link',
            'share.revoke': 'Stop sharing',
            'share.close': 'Close',
            'todo.title': '✅ Checklist',
            'summary.title': '📝 AI summary',
            'panel.hide': 'Hide',
            'panel.show': 'Show',
            'ai.polish': '✨ Polish',
            'ai.summarize': '📝 Summary',
            'ai.todos': '✅ To-dos',
            'notes.loading': 'Loading notes...',
            'btn.save': '💾 Save',
            'btn.delete': '🗑️ Delete',
            'form.title': 'Title',
            'form.titlePlaceholder': 'Enter note title...',
            'form.content': 'Content',
            'form.contentPlaceholder': 'Start writing your note...',
            'form.tags': 'Tags (comma separated)',
            'form.tagsPlaceholder': 'e.g. work,ideas,personal',
            'form.eventDate': 'Event Date',
            'form.eventTime': 'Event Time',
            'form.public': '🌐 Make this note public (visible to other visitors)',
            'empty.title': 'Welcome to NoteTaker!',
            'empty.desc': 'Pick a note on the left, or create a new one to get started.',
            'login.title': '🔑 Enter password',
            'login.desc': 'Sign in to see every note, create and edit without limits, and use AI generation.',
            'login.placeholder': 'Enter password',
            'login.cancel': 'Cancel',
            'login.submit': 'Sign in'
        };

        const MSG = {
            zh: {
                'lang.switchLabel': '🌐 English',
                'editor.selectPrompt': '选择一条笔记开始编辑',
                'role.loggedIn': '✅ 已登录（完整权限）',
                'role.readonly': '📖 只读浏览',
                'role.guest': '👤 游客模式',
                'role.hintReadonly': '笔记由管理员维护',
